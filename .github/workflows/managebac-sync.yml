name: ManageBac sync and archive

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 11 * * 1-5"

concurrency:
  group: managebac-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync and download classroom archives
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          SIWC_BYPASS_TOKEN: ${{ secrets.SIWC_BYPASS_TOKEN }}
        run: |
          set -euo pipefail
          successful_syncs=0
          for student in advika adrika; do
            response="/tmp/classroom-${student}.json"
            request="/tmp/classroom-${student}-request.json"
            latest="data/classroom/${student}/latest.json"
            if [[ -f "$latest" ]]; then
              jq '
                [
                  .. | objects |
                  select(
                    (.sourceUrl? | type) == "string" and
                    (.url? | type) == "string"
                  ) |
                  { key: .sourceUrl, value: .url }
                ] |
                from_entries |
                { knownAssets: . }
              ' "$latest" > "$request"
            else
              printf '{"knownAssets":{}}\n' > "$request"
            fi

            if curl --fail-with-body --show-error --silent \
              --retry 2 \
              --request POST \
              --header "x-sync-secret: ${SYNC_SECRET}" \
              --header "OAI-Sites-Authorization: Bearer ${SIWC_BYPASS_TOKEN}" \
              --header "content-type: application/json" \
              --data-binary "@${request}" \
              --output "$response" \
              "${SYNC_URL}?student=${student}" &&
              jq -e '.ok == true and (.archives | length == 1)' "$response" >/dev/null; then
              successful_syncs=$((successful_syncs + 1))
            else
              rm -f "$response"
              printf '%s\n' "$student" >> /tmp/failed-students
            fi
          done
          [[ "$successful_syncs" -gt 0 ]]

      - name: Persist snapshots and assets in the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/classroom

          for student in advika adrika; do
            response="/tmp/classroom-${student}.json"
            [[ -f "$response" ]] || continue
            synced_at=$(jq -r '.archives[0].snapshot.syncedAt' "$response")
            history_name=$(printf '%s' "$synced_at" | tr ':.' '--')
            student_dir="data/classroom/${student}"
            mkdir -p "${student_dir}/history" "${student_dir}/assets"

            node scripts/stamp-classroom-mapped-at.mjs \
              "$student" \
              "$response" \
              "${student_dir}/latest.json"
            cp "${student_dir}/latest.json" "${student_dir}/history/${history_name}.json"

            jq -c '.archives[0].assets[]' "$response" | while IFS= read -r asset; do
              path=$(jq -r '.path' <<<"$asset")
              case "$path" in
                data/classroom/*/assets/*) ;;
                *) echo "Unsafe archive path: $path" >&2; exit 1 ;;
              esac
              mkdir -p "$(dirname "$path")"
              jq -r '.contentBase64' <<<"$asset" | base64 --decode > "$path"
            done
          done

          index_tmp="/tmp/classroom-index.json"
          if [[ -f data/classroom/index.json ]]; then
            cp data/classroom/index.json "$index_tmp"
          else
            printf '{"students":[]}\n' > "$index_tmp"
          fi

          for student in advika adrika; do
            response="/tmp/classroom-${student}.json"
            [[ -f "$response" ]] || continue
            name=$(jq -r '.archives[0].snapshot.studentName' "$response")
            synced_at=$(jq -r '.archives[0].snapshot.syncedAt' "$response")
            status=$(jq -r '.archives[0].snapshot.status' "$response")
            jq \
              --arg key "$student" \
              --arg name "$name" \
              --arg syncedAt "$synced_at" \
              --arg status "$status" \
              '
                ([.students[]? | select(.key == $key)][0] // {}) as $old |
                .students = (
                  [.students[]? | select(.key != $key)] +
                  [{
                    key: $key,
                    name: $name,
                    syncedAt: $syncedAt,
                    status: $status,
                    historyCount: (($old.historyCount // 0) + 1)
                  }]
                ) |
                .students |= sort_by(.name)
              ' "$index_tmp" > "${index_tmp}.next"
            mv "${index_tmp}.next" "$index_tmp"
          done
          mv "$index_tmp" data/classroom/index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classroom
          git diff --cached --quiet && exit 0
          git commit -m "Archive classroom snapshot and assets"
          git pull --rebase origin main
          git push

      - name: Report partial sync failures
        if: always()
        run: |
          if [[ -s /tmp/failed-students ]]; then
            echo "Sync failed for: $(paste -sd, /tmp/failed-students)"
            exit 1
          fi
